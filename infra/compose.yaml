name: paircode-dev
services:
  worker:
    profiles: ['execution']
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paircode}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paircode}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SANDBOX_API_URL: ${SANDBOX_API_URL:-}
      SANDBOX_AUTH_TOKEN: ${SANDBOX_AUTH_TOKEN:-}
      SANDBOX_PYTHON_LANGUAGE_ID: ${SANDBOX_PYTHON_LANGUAGE_ID:-}
      SANDBOX_CPU_SECONDS: ${SANDBOX_CPU_SECONDS:-2}
      SANDBOX_WALL_SECONDS: ${SANDBOX_WALL_SECONDS:-10}
      SANDBOX_MEMORY_KB: ${SANDBOX_MEMORY_KB:-131072}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paircode}
      POSTGRES_DB: ${POSTGRES_DB:-paircode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in .env}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  collaboration:
    build:
      context: ..
      dockerfile: infra/docker/collaboration.Dockerfile
    environment:
      COLLABORATION_HOST: 0.0.0.0
      COLLABORATION_PORT: 1234
      DATABASE_URL: postgresql://${POSTGRES_USER:-paircode}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paircode}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COLLABORATION_CONTROL_SECRET: ${COLLABORATION_CONTROL_SECRET:?Set a random control secret in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ['127.0.0.1:1234:1234']
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:1234/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
  redis_data:
