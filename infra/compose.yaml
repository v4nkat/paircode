name: paircode-dev
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paircode}
      POSTGRES_DB: ${POSTGRES_DB:-paircode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in .env}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  collaboration:
    build:
      context: ..
      dockerfile: infra/docker/collaboration.Dockerfile
    environment:
      COLLABORATION_HOST: 0.0.0.0
      COLLABORATION_PORT: 1234
    ports: ['127.0.0.1:1234:1234']
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:1234/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
  redis_data:
