name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: paircode_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: paircode_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U paircode_test -d paircode_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://paircode_test:disposable_ci_only@127.0.0.1:5432/paircode_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
